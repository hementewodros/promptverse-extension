<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <title>PromptVerse</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

<div class="container">
  <h1>PromptVerse</h1>

  <!-- STEP 1 -->

<script src="popup.js"></script>

</html>
